<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1419" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)" />
    <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <g transform="rotate(-5 32 32)">
              <rect x="14" y="16" width="36" height="36" rx="6" fill="none" stroke="#FF6B35" stroke-width="2.5"/>
              <rect x="14" y="16" width="36" height="10" rx="6" fill="#FF6B35"/>
              <rect x="14" y="20" width="36" height="6" fill="#FF6B35"/>
              <circle cx="22" cy="18" r="1.5" fill="none" stroke="#E8E8E3" stroke-width="1.5"/>
              <circle cx="32" cy="18" r="1.5" fill="none" stroke="#E8E8E3" stroke-width="1.5"/>
              <circle cx="42" cy="18" r="1.5" fill="none" stroke="#E8E8E3" stroke-width="1.5"/>
            </g>
            <g transform="rotate(-5 32 32)">
              <circle cx="20" cy="32" r="2" fill="#FF6B35" opacity="0.5"/>
              <circle cx="28" cy="32" r="2" fill="#FF6B35" opacity="0.5"/>
              <circle cx="36" cy="32" r="2" fill="#FF6B35" opacity="0.7"/>
              <circle cx="44" cy="32" r="2" fill="#4A90E2"/>
              <circle cx="20" cy="40" r="2" fill="#FF6B35" opacity="0.5"/>
              <circle cx="28" cy="40" r="2" fill="#4A90E2" opacity="0.7"/>
              <circle cx="36" cy="40" r="2" fill="#4A90E2"/>
              <circle cx="44" cy="40" r="2.5" fill="#2ECC71"/>
            </g>
          </svg>
        </span>
        <span class="brand-name">Deadline Pro</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/privacy' | relative_url }}">Privacy</a>
        <a href="{{ '/terms' | relative_url }}">Terms</a>
        <a href="mailto:abdessamad.raihani@outlook.com">Support</a>
      </nav>
    </header>

    <main class="site-main {% if page.layout-narrow %}narrow{% endif %}">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="foot-row">
        <span>© 2026 Abdessamad Raihani</span>
        <span class="dot" aria-hidden="true">•</span>
        <a href="{{ '/privacy' | relative_url }}">Privacy</a>
        <span class="dot" aria-hidden="true">•</span>
        <a href="{{ '/terms' | relative_url }}">Terms</a>
        <span class="dot" aria-hidden="true">•</span>
        <a href="mailto:abdessamad.raihani@outlook.com">abdessamad.raihani@outlook.com</a>
      </div>
    </footer>
  </body>
</html>
